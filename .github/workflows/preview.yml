name: Publish to Expo Go

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Run tests
        run: bun test

      - name: Install Expo and match package versions to its SDK
        run: |
          npm install
          npx expo install expo-status-bar @react-native-async-storage/async-storage react react-native expo-updates
          npx expo install --fix

      - name: Type-check
        run: npx tsc --noEmit

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link the Expo project
        run: eas init --non-interactive --force

      - name: Configure updates
        run: |
          eas update:configure --platform all --non-interactive || true
          # keep the Expo Go runtime policy even if configure changed it
          node -e "const f='app.json',j=require('./'+f);j.expo.runtimeVersion={policy:'sdkVersion'};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"

      - name: Publish update
        run: |
          eas update --branch preview --message "${{ github.event.head_commit.message || 'Manual publish' }}" --non-interactive --json > update.json
          cat update.json
          PROJECT_ID=$(node -p "require('./app.json').expo.extra.eas.projectId")
          GROUP=$(node -p "require('./update.json')[0].group")
          {
            echo "## Open in Expo Go"
            echo ""
            echo "On your phone, open: https://expo.dev/projects/$PROJECT_ID/updates/$GROUP"
            echo ""
            echo "Then tap **Preview** (or scan the QR code there) to load it in Expo Go."
          } >> "$GITHUB_STEP_SUMMARY"
          SDK=$(node -p "require('expo/package.json').version")
          RUNTIME=$(node -p "require('./update.json')[0].runtimeVersion")
          echo "::notice title=Expo Go link::https://expo.dev/projects/$PROJECT_ID/updates/$GROUP (expo $SDK, runtime $RUNTIME)"

      - name: Report update details
        if: always()
        run: |
          GROUP=$(node -p "require('./update.json')[0].group" 2>/dev/null || echo none)
          echo "::notice title=App config::$(npx expo config --type public --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const c=JSON.parse(s);console.log(JSON.stringify({sdk:c.sdkVersion,runtime:c.runtimeVersion,updates:c.updates,platforms:c.platforms}))})")"
          echo "::notice title=Update entries::$(node -e "console.log(JSON.stringify(require('./update.json').map(u=>({p:u.platform,rt:u.runtimeVersion,id:u.id}))))")"
          eas update:view "$GROUP" --json > view.json 2>&1 || true
          echo "::notice title=Update view::$(head -c 1500 view.json | tr '\n' ' ')"
